# The Filing Wire — refreshes src/data/wire.json from SEC EDGAR submissions feeds.
# Lightweight (just the recent-filings lists), so it runs daily on its own, keeping
# the site current without the heavier fundamentals/filings refresh.
name: Filing Wire

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1-5" # weekdays 11:00 UTC, after most filings post

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run fetch:wire
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      # The 10-year Treasury yield, the risk-free anchor the valuation's Graham bond test prefills.
      # Public-domain government data (FRED/Treasury), fetched here so the default stays current; it
      # fails soft, so a yield-fetch hiccup never blocks the wire commit.
      - run: npm run fetch:rates
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      # Per-filing refresh: the companies that filed a 10-K/10-Q get their fundamentals
      # re-fetched in the same run, so the wire item and the lit-up company page go live in the
      # same deploy. The window is 2 days, not 1 — that gives every filer a second attempt the
      # next morning, which self-heals the edge where companyfacts still lags a same-morning
      # filing when the wire runs. ONLY_FUND re-fetches just the named tickers and merges over
      # the last good file, so the catalog is never truncated.
      - name: Find the periodic filers
        id: filers
        run: |
          tickers=$(node -e "const w=require('./src/data/wire.json');const cut=new Date(Date.now()-2*86400000).toISOString().slice(0,10);console.log([...new Set((w.items||[]).filter((i)=>(i.form==='10-K'||i.form==='10-Q')&&i.date>=cut).map((i)=>String(i.ticker).toUpperCase()))].join(','))")
          echo "tickers=$tickers" >> "$GITHUB_OUTPUT"
          echo "Periodic filers in the 2-day window: ${tickers:-none}"
      - name: Refresh fundamentals for the filers
        if: steps.filers.outputs.tickers != ''
        run: npm run fetch:fundamentals
        env:
          ONLY_FUND: ${{ steps.filers.outputs.tickers }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      # The same audits the fundamentals workflow runs: a targeted refresh must clear the same
      # bar before it is committed, or a bad merge would publish sitewide.
      - name: Audit the refreshed data
        if: steps.filers.outputs.tickers != ''
        run: npm run audit && npm run audit:believe && npm run audit:coverage
      # The full test suite against the fresh data, before the push: a workflow-token push does
      # not trigger CI, so this is the only test gate a wire refresh ever passes. Red blocks the
      # commit and emails the owner.
      - name: Test against the fresh data
        run: npm test
      # The filings-tweet drafter used to run here (2026-07-08 – 2026-07-13); retired because the
      # hand-review step made it a daily chore. docs/marketing-plan.md records the decision.
      - name: Commit if changed
        id: commit
        run: |
          if ! git diff --quiet -- src/data/wire.json src/data/rates.json src/data/fundamentals.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/wire.json src/data/rates.json src/data/fundamentals.json
            git commit -m "Refresh the filing wire, the risk-free rate, and the day's filers"
            # Rebase-and-retry so a concurrent push (an overlapping fundamentals run) can't silently
            # drop the day's wire + risk-free-rate refresh, the way a bare push otherwise would.
            pushed=""
            for i in 1 2 3 4 5; do
              git push && pushed=1 && break
              echo "push rejected; rebasing on origin/$GITHUB_REF_NAME and retrying ($i)…"
              git pull --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort; true; }
              sleep $((i * 3))
            done
            # Without this check, five failed pushes end the step green and the refresh is
            # silently lost — the run must go red so the owner is emailed.
            if [ -z "$pushed" ]; then
              echo "::error::git push failed after 5 attempts — the wire/rates refresh was NOT published"
              exit 1
            fi
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          else
            echo "No change."
          fi
      # Machine-to-machine only (doctrine-blessed): tell IndexNow which pages changed so Bing and
      # its peers crawl the fresh wire and the day's lit-up records within minutes, not on the next
      # passive recrawl. Fires only on a real push, waits for the deploy to be live (today's date
      # visible in /wire-lite.json) before submitting, and is fully fail-soft — a ping problem never
      # touches the data commit.
      - name: Notify IndexNow of the day's changes
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        run: |
          today=$(date -u +%Y-%m-%d)
          urls="/ /wire /wire.xml /wire-lite.json /sitemap-index.xml"
          IFS=',' read -ra FILERS <<< "${{ steps.filers.outputs.tickers }}"
          for t in "${FILERS[@]}"; do
            [ -n "$t" ] && urls="$urls /c/$t /c/$t.json"
          done
          node scripts/pingIndexNow.mjs --wait-url=https://ownerscorecard.com/wire-lite.json --wait-text="$today" $urls

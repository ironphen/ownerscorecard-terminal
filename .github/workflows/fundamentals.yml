# Refreshes the deep data (fundamentals.json + language.json + segments.json) from
# SEC EDGAR and commits any change, which redeploys the site. Self-maintaining on two
# schedules, no manual upkeep: fundamentals (the quarterly-changing figures) refresh
# weekly on Mondays, while the heavier filing-language and segment fetches plus a fresh
# Nasdaq universe rebuild run monthly on the 1st — so new names enter on their own and
# the weekly run stays light. Either can be kicked by hand from the Actions tab. The
# lighter Filing Wire (wire.yml) refreshes daily.
# Set an Actions variable SEC_USER_AGENT with a contact string (SEC requests one).
name: Fundamentals

on:
  workflow_dispatch:
    inputs:
      segments_only:
        description: "Run only the segment fetch (skip fundamentals/filings)"
        type: boolean
        default: false
      drivers_only:
        description: "Run only the MD&A-drivers extraction (needs segments.json priors; run segments first)"
        type: boolean
        default: false
      filings_only:
        description: "Run only the filing-language fetch (skip fundamentals/segments)"
        type: boolean
        default: false
      filings_pool:
        description: "Which pool the filing-language fetch covers (the other carries over). Blank = both."
        type: choice
        options:
          - ""
          - "us"
          - "adr"
          - "both"
        default: ""
      fundamentals_only:
        description: "Run only the fundamentals fetch (skip filings/segments) — the light refresh"
        type: boolean
        default: false
      fetch_adr:
        description: "Also fetch the ADR pool (IFRS/US-GAAP 20-F fundamentals). Needs universe.adr.json; pair with rebuild_universe=write to bootstrap it."
        type: boolean
        default: false
      fetch_adr_segments:
        description: "Fetch ADR segments (foreign 20-F where-the-money-comes-from). Pair with tickers to verify a subset."
        type: boolean
        default: false
      tickers:
        description: "Limit the segment AND fundamentals fetch to these tickers (comma-separated; blank = all). The rest carry over from the last good file."
        type: string
        default: ""
      debug:
        description: "Dump raw XBRL axes for these tickers (comma-separated; diagnostic only)"
        type: string
        default: ""
      rebuild_universe:
        description: "Rebuild the US universe from the Nasdaq screener, top names by market cap (dryrun = test the source only; write = rebuild then refetch all)"
        type: choice
        options:
          - "off"
          - "dryrun"
          - "write"
        default: "off"
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC — weekly: fundamentals only (quarterly-changing figures)
    - cron: "0 8 1 * *" # 1st 08:00 UTC — monthly: rebuild universe + fundamentals + filings + segments

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Keep the pre-fetch data as the delta baseline: auditIntegrity's cross-refresh check reads
      # PRIOR_DIR to flag a top line that swung >60% or a currency that flipped between refreshes —
      # the re-tag/carry-over class no point-in-time audit can see.
      - name: Snapshot prior data
        run: mkdir -p "$RUNNER_TEMP/prior" && cp src/data/*.json "$RUNNER_TEMP/prior/"
      # Rebuild the US universe from the Nasdaq screener (top names by market cap): every month
      # on the schedule, and on demand. dryrun fetches and reports only (the fetch step below is
      # skipped); write/monthly overwrites universe.json, which the fetch then reads. A failed or
      # implausible fetch leaves the existing universe untouched, so it can never corrupt the input.
      - name: Rebuild universe
        if: ${{ github.event.inputs.rebuild_universe == 'dryrun' || github.event.inputs.rebuild_universe == 'write' || github.event.schedule == '0 8 1 * *' }}
        run: node scripts/buildUniverse.mjs
        env:
          UNIVERSE_DRYRUN: ${{ github.event.inputs.rebuild_universe == 'dryrun' && '1' || '' }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      # The retry the comment below always promised, now actually on THIS step (2026-08-13: the
      # wire's evening runs died twice to the undici teardown before anyone noticed the loop only
      # ever guarded fetch:filings). The fetch rebuilds from scratch and carries the prior file,
      # so a fresh attempt is safe; three failures still fail the job so the alarm fires.
      - name: Run fetch:fundamentals
        if: ${{ github.event.inputs.segments_only != 'true' && github.event.inputs.filings_only != 'true' && github.event.inputs.drivers_only != 'true' && github.event.inputs.rebuild_universe != 'dryrun' }}
        run: |
          for i in 1 2 3; do
            npm run fetch:fundamentals && exit 0
            echo "fetch:fundamentals attempt $i crashed (the transient undici teardown is the known class); retrying…"
            sleep 10
          done
          exit 1
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          DEBT_DEBUG: ${{ github.event.inputs.debug }}
          REVENUE_DEBUG: ${{ github.event.inputs.debug }}
          DEP_DEBUG: ${{ github.event.inputs.debug }}
          SHARES_DEBUG: ${{ github.event.inputs.debug }}
          CFO_DEBUG: ${{ github.event.inputs.debug }}
          CAPEX_DEBUG: ${{ github.event.inputs.debug }}
          CASH_DEBUG: ${{ github.event.inputs.debug }}
          ONLY_FUND: ${{ github.event.inputs.tickers }}
      # Filing language and segments only change when a company files a new annual report, so the
      # weekly Monday cron skips them; they refresh on the monthly cron and on demand.
      # Retry the whole fetch on a transient crash. Node's built-in HTTP client (undici) can throw an
      # internal "assert(!this.paused)" from a TLS socket tearing down mid-parse — an async, event-loop
      # error that escapes the per-company try/catch and would otherwise kill the hour-long run and lose
      # every company parsed before it. The fetch is idempotent (it rebuilds from scratch and carries
      # over the prior file), so a fresh attempt is safe; up to three before giving up. Still
      # continue-on-error, so even three failures leave the prior good data and never block the refresh.
      # The filing rhythms behind the wire's "week ahead" band: each filer's class, statutory
      # deadline, and its own median filing lag, from the submissions index. Rhythms drift at
      # quarter speed, so the weekly cadence is plenty; the wire's daily build rolls the window.
      - name: Refresh filing rhythms (upcoming.json)
        if: ${{ github.event.inputs.segments_only != 'true' && github.event.inputs.filings_only != 'true' && github.event.inputs.drivers_only != 'true' }}
        continue-on-error: true # a stale rhythm file is a slightly stale week-ahead band, never a broken refresh
        run: npm run fetch:upcoming
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      # Tier-2: the named dimensional targets, read from the filings' own inline XBRL before the
      # fundamentals refresh so the merge picks up fresh values. A failed run leaves last week's
      # file — the walls it lowered stay lowered on slightly stale data, never a broken refresh.
      - name: Refresh dimensional targets (dimensional.json)
        if: ${{ github.event.inputs.segments_only != 'true' && github.event.inputs.filings_only != 'true' && github.event.inputs.drivers_only != 'true' }}
        continue-on-error: true
        run: npm run fetch:dimensional
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      - name: Run fetch:filings
        if: ${{ github.event.inputs.segments_only != 'true' && github.event.inputs.fundamentals_only != 'true' && github.event.inputs.drivers_only != 'true' && github.event.schedule != '0 7 * * 1' }}
        continue-on-error: true # qualitative layer; never fail the fundamentals refresh
        run: |
          for i in 1 2 3; do
            npm run fetch:filings && exit 0
            echo "fetch:filings attempt $i failed (likely a transient undici/network crash); retrying…"
            sleep 10
          done
          echo "fetch:filings failed after 3 attempts; the prior good language file carries over."
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          BIZ_DEBUG: ${{ github.event.inputs.debug }}
          ONLY_TICKERS: ${{ github.event.inputs.tickers }} # limit the filing-language run (the rest carry over)
          POOL: ${{ github.event.inputs.filings_pool }} # us | adr | both (blank = both); the other pool carries over
      - run: npm run fetch:segments
        if: ${{ github.event.inputs.filings_only != 'true' && github.event.inputs.fundamentals_only != 'true' && github.event.inputs.drivers_only != 'true' && github.event.schedule != '0 7 * * 1' }}
        continue-on-error: true # where-the-money-comes-from layer; never fail the refresh
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          ONLY_TICKERS: ${{ github.event.inputs.tickers }}
          SEG_DEBUG: ${{ github.event.inputs.debug }}
      # The ADR pool (foreign 20-F filers, IFRS or US-GAAP). Annual filings, so it refreshes on the
      # monthly cron and on demand; reads universe.adr.json, which the rebuild step above writes (pair
      # fetch_adr with rebuild_universe=write to bootstrap). Non-fatal: a separate pool never blocks
      # the US refresh.
      # Weekly as of 2026-08-05, not just monthly: the site's floor stamp — "company pages as of",
      # on every page — reads the OLDEST of the four fundamentals pools, so any monthly pool drags
      # the reader-visible date toward a month old. The owner spotted the label reading July 18 on
      # August 4 (the discarded Aug-1 monthly run was never re-dispatched; only its language layer
      # had been recovered by hand). ADR filings are annual, but the stamp is a promise about our
      # refresh, not about the filers' cadence. Segments and ratios stay monthly — they change at
      # filing speed; this step carries the pool's asOf.
      - run: npm run fetch:fundamentals:adr
        if: ${{ (github.event.inputs.fetch_adr == 'true' || github.event.schedule == '0 8 1 * *' || github.event.schedule == '0 7 * * 1') }}
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          ONLY_ADR: ${{ github.event.inputs.tickers }}
          ADR_DEBUG: ${{ github.event.inputs.debug }}
      # ADR segments (foreign 20-F where-the-money-comes-from): reads fundamentals.adr.json, resolves each
      # filing's XBRL instance via the submissions API, and writes its breakdowns into the shared
      # segments.json, preserving the US entries. Annual filings, so it refreshes monthly and on demand;
      # non-fatal so a segment hiccup never blocks the refresh.
      - run: npm run fetch:segments:adr
        if: ${{ (github.event.inputs.fetch_adr_segments == 'true' || github.event.inputs.fetch_adr == 'true' || github.event.schedule == '0 8 1 * *') }}
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          ONLY_ADR: ${{ github.event.inputs.tickers }}
          SEG_DEBUG: ${{ github.event.inputs.debug }}
      # ADS ratios (how many ordinary shares one US-listed ADS represents), parsed verbatim from
      # each 20-F/40-F cover. They let the valuation tool accept the US dollar quote a reader
      # actually holds. Ratios essentially never change, so monthly is generous; non-fatal.
      - run: npm run fetch:adr:ratios
        if: ${{ (github.event.inputs.fetch_adr == 'true' || github.event.schedule == '0 8 1 * *') }}
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          ONLY_ADR: ${{ github.event.inputs.tickers }}
      # MD&A drivers: the company's own cause sentences, anchored to the record and its segments
      # and checked against the filed figures (scripts/fetchDrivers.mjs). Needs the segment priors
      # the fetch above writes, so it runs after; annual-filing cadence, so the weekly cron skips
      # it. Non-fatal: a drivers hiccup never blocks the refresh, and a company with nothing
      # verified simply carries no section.
      - run: npm run fetch:drivers
        if: ${{ github.event.inputs.filings_only != 'true' && github.event.inputs.fundamentals_only != 'true' && github.event.inputs.segments_only != 'true' && github.event.schedule != '0 7 * * 1' }}
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          ONLY_TICKERS: ${{ github.event.inputs.tickers }}
      # Data-quality gate: runs the same lib functions the pages do. A systemic coverage
      # cliff (a taxonomy change that drops a whole data layer) fails this step and blocks
      # the commit below, so a broadly-broken refresh is never shipped. Per-company issues
      # print loudly for review but do not block, so one odd filer can't freeze the weekly
      # run. Runs before the commit on purpose.
      - name: Audit data quality
        if: ${{ github.event.inputs.debug == '' }}
        run: npm run audit
      # Believability gate: catches a page that contradicts itself or prints an arithmetically
      # impossible figure — a 100% gross margin on a goods maker, a net-cash balance sheet in a
      # year whose debt simply wasn't tagged, a through-cycle range that excludes the very figure
      # shown beside it. A confirmed contradiction (error) fails the step and blocks the commit;
      # softer warnings print for review. Runs the same lib functions the pages render from, so it
      # can never drift from the display.
      # Scoped to the pools this workflow writes: JP and EU refreshes run these checks in their
      # own workflows, so a break there reddens the responsible run, not this one.
      - name: Audit believability
        if: ${{ github.event.inputs.debug == '' }}
        run: npm run audit:believe
        env:
          POOLS: US,ADR
      # Ingestion guardrail: across all three pools (US, ADR, Japan), is the data GBM analysis needs
      # actually PRESENT and FRESH — owner-earnings inputs, depreciation, a through-cycle record, a
      # share count — or has a whole layer quietly cratered or a pool stopped refreshing? A coverage
      # cliff or a stalled pool fails the step and blocks the commit, so the catalog can never thin out
      # silently; known-thin source realities (ADR depth, Japan's ~5-year record) warn but don't block.
      - name: Audit coverage
        if: ${{ github.event.inputs.debug == '' }}
        run: npm run audit:coverage
      # The silent-failure gate: bellwether mega-caps must still be present with a plausible, recent
      # top line; financials must nearly all resolve one; no operating income exceeds revenue at scale.
      # Catches the classes coverage/data can't — a mega-cap vanishing, a category going hollow, an
      # impossible figure — before the commit ships them.
      - name: Audit integrity
        if: ${{ github.event.inputs.debug == '' }}
        run: npm run audit:integrity
        env:
          PRIOR_DIR: ${{ runner.temp }}/prior
      # The series gate: fiscal-year structure, share-count steps, TTM vintage — the record read AS
      # A SERIES (docs/correctness-campaign.md N3). Gated by the committed identity baseline
      # (continuity-baseline.json): the known pre-campaign tail passes by name, one NEW break
      # blocks. Scoped to the pools this workflow writes.
      - name: Audit continuity
        if: ${{ github.event.inputs.debug == '' }}
        run: npm run audit:continuity
        env:
          POOLS: US,ADR
      # The full test suite, against the freshly fetched data, BEFORE the push. A push made with
      # the workflow token does not trigger the CI workflow (GitHub suppresses recursive runs), so
      # without this step a data refresh that breaks the product lands silently green — which is
      # exactly how the sharesForValue rollout broke the compare-card goldens unnoticed. A red run
      # here blocks the commit and emails the owner.
      - name: Test against the fresh data
        if: ${{ github.event.inputs.debug == '' }}
        run: npm test
      # The gate above is correct — data that breaks the product must not land — but a red test
      # also DESTROYS the refresh, and the refresh is hours of SEC fetching. On 2026-08-01 the
      # monthly pass computed the whole pool in 3h24m, passed every audit, failed one test pinned
      # to live data, and skipped the commit; the work was gone and the qualitative layer stayed
      # frozen for weeks. Keep the computed data as an artifact whenever the run fails, so the fix
      # is "download and commit" rather than "recompute overnight and hope".
      - name: Preserve the computed data when the run fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: data-refresh-${{ github.run_id }}
          path: src/data/*.json
          retention-days: 14
          if-no-files-found: warn
      - name: Commit if changed
        if: ${{ github.event.inputs.debug == '' }}
        run: |
          # Stage every data file, the ADR pair guarded since it may not exist yet, then commit only
          # if anything actually staged — so a new ADR file is captured and a no-op run stays quiet.
          git add src/data/fundamentals.json src/data/language.json src/data/segments.json src/data/universe.json
          git add src/data/drivers.json src/data/adrRatios.json 2>/dev/null || true
          git add src/data/universe.adr.json src/data/fundamentals.adr.json 2>/dev/null || true
          git add src/data/upcoming.json 2>/dev/null || true
          git add src/data/dimensional.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh fundamentals + filing language + segments"
            # Rebase-and-retry so a concurrent push can't silently drop the data refresh.
            pushed=""
            for i in 1 2 3 4 5; do
              git push && pushed=1 && break
              echo "push rejected; rebasing on origin/$GITHUB_REF_NAME and retrying ($i)…"
              git pull --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort; true; }
              sleep $((i * 3))
            done
            # Without this check, five failed pushes end the step green and the refresh is
            # silently lost — the run must go red so the owner is emailed.
            if [ -z "$pushed" ]; then
              echo "::error::git push failed after 5 attempts — the fundamentals refresh was NOT published"
              exit 1
            fi
          else
            echo "No change."
          fi

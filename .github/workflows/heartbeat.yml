# Heartbeat — the active alert behind the site's passive "data as of" masthead. Runs daily and FAILS
# (which emails the repo owner via GitHub's default workflow-failure notification) if the whole data
# pipeline has gone quiet, i.e. the freshest pool is older than the threshold. No commit, no write,
# no secrets — it only reads the committed as-of stamps. See scripts/checkFreshness.mjs for the logic
# and the 60-day-cron-disable caveat.
name: Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *" # daily 13:00 UTC, after the weekday wire refresh has had time to land

permissions:
  contents: read
  actions: read # for the backup-recency assertion below

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/checkFreshness.mjs
        env:
          MAX_FRESH_DAYS: "6"
      # The weekly DB backup (reader accounts, follows, wire subscriptions) skips green when its
      # secret is missing and its failures are just another workflow email — so assert here,
      # where a miss emails the owner daily, that a successful backup ran within the last 9 days.
      - name: Assert a recent DB backup exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow=db-backup.yml --status=success --limit 1 --json updatedAt --jq '.[0].updatedAt' 2>/dev/null || echo "")
          if [ -z "$last" ] || [ "$last" = "null" ]; then
            echo "::error::No successful DB backup run found — the reader-relationship data is unbacked"
            exit 1
          fi
          age_days=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          echo "Last successful DB backup: $last (${age_days}d ago)"
          if [ "$age_days" -gt 9 ]; then
            echo "::error::Last successful DB backup is ${age_days} days old (>9) — the weekly backup has stopped"
            exit 1
          fi
      # CI is a test gate that does not gate anything: Cloudflare builds from the repo on its own,
      # so a red suite reaches readers unannounced — it did three times on 2026-07-31, over a
      # golden fixture left stale by a legitimate data refresh, while local reads called it green.
      # The suite is deliberately NOT made a deploy blocker (a stale fixture must never freeze
      # fresh filings), so the alarm is made loud instead: asserted here, where a miss emails the
      # owner daily, that the newest CI run on main passed.
      - name: Assert the newest CI run on main is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          concl=$(gh run list --workflow=ci.yml --branch=main --status=completed --limit 1 --json conclusion --jq '.[0].conclusion' 2>/dev/null || echo "")
          if [ -z "$concl" ] || [ "$concl" = "null" ]; then
            echo "::error::No completed CI run found on main — the test gate is not reporting"
            exit 1
          fi
          echo "Newest completed CI run on main: $concl"
          if [ "$concl" != "success" ]; then
            echo "::error::The newest CI run on main concluded '$concl' — the suite is red and the site is deploying anyway"
            exit 1
          fi
